<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator — Công Cụ Quay Số Ngẫu Nhiên</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --accent: #06b6d4;
            --bg-dark: #090d16;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-light: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng quầng sáng nền chuyển động mượt mà */
        .ambient-light {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.45;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .light-1 {
            background: #2563eb;
            top: -150px;
            left: -100px;
        }
        .light-2 {
            background: #0891b2;
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        /* Lưới họa tiết nền */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 36px 36px;
            z-index: 0;
            pointer-events: none;
        }

        /* Khung ứng dụng chính */
        .app-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }

        /* Thanh tiêu đề */
        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.3px;
        }
        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 99px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
        }

        /* Khu vực hiển thị số trung tâm */
        .display-section {
            padding: 36px 24px 28px;
            text-align: center;
            position: relative;
        }
        .display-ring {
            width: 170px;
            height: 170px;
            margin: 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(59, 130, 246, 0.15) 0%, rgba(15, 23, 42, 0.8) 70%);
            border: 2px solid rgba(59, 130, 246, 0.35);
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.2), inset 0 0 20px rgba(59, 130, 246, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .display-ring.spinning {
            border-color: #38bdf8;
            box-shadow: 0 0 45px rgba(56, 189, 248, 0.45), inset 0 0 25px rgba(56, 189, 248, 0.25);
        }
        .display-ring.pop {
            transform: scale(1.06);
            border-color: #60a5fa;
            box-shadow: 0 0 55px rgba(96, 165, 250, 0.6);
        }
        .result-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }
        .result-value {
            font-size: 84px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff 20%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
        }

        /* Thông số Min - Max */
        .range-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 24px 24px;
        }
        .range-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .range-box span.title {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .range-box span.val {
            font-size: 16px;
            font-weight: 700;
            color: #e2e8f0;
        }

        /* Nút bấm hành động */
        .action-area {
            padding: 0 24px 24px;
        }
        button#spinBtn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #0284c7 100%);
            color: white;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.8px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        button#spinBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            filter: brightness(1.08);
        }
        button#spinBtn:active:not(:disabled) {
            transform: translateY(0);
        }
        button#spinBtn:disabled {
            background: #1e293b;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Lịch sử quay */
        .history-bar {
            background: rgba(9, 13, 22, 0.6);
            border-top: 1px solid var(--border-light);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-title {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .history-items {
            display: flex;
            gap: 6px;
        }
        .history-badge {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #cbd5e1;
        }
        .history-badge:first-child {
            background: rgba(59, 130, 246, 0.25);
            border-color: rgba(59, 130, 246, 0.5);
            color: #60a5fa;
        }
        .empty-text {
            font-size: 12px;
            color: #475569;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="ambient-light light-1"></div>
<div class="ambient-light light-2"></div>
<div class="grid-overlay"></div>

<div class="app-card">
    <div class="card-header">
        <div class="brand">
            <div class="brand-icon">#</div>
            <span>Random.io</span>
        </div>
        <div class="status-pill">
            <div class="dot"></div>
            <span>CSPRNG Sẵn sàng</span>
        </div>
    </div>
